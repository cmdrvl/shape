[package]
name = "shape"
version = "0.11.0"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Structural comparability gate — can these two CSV datasets be compared at all?"
license = "MIT"
repository = "https://github.com/cmdrvl/shape"
readme = "README.md"
keywords = ["csv", "schema", "comparability", "cli", "reconciliation"]
categories = ["command-line-utilities"]

[[bin]]
name = "shape"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"], optional = true }
csv = "1"
# Pinned by exact rev. default-features = false: core's default turns on serde_json/float_roundtrip,
# which would change how this crate parses floats.
cmdrvl-core = { git = "https://github.com/cmdrvl/core", rev = "9cdf14a55f33fd8f426cbeb54fca478885239e7c", default-features = false }
# JSONL / Parquet / XLSX inputs (CSV and TSV keep shape's own reader and dialect detection). Pinned by commit.
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "e83afb0ebe848a58c888cf619b105cbad19852e6", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.10"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[features]
default = ["cli", "tabular", "zstd"]
cli = ["dep:clap"]
tabular = ["dep:cmdrvl-tabular"]
zstd = ["cmdrvl-tabular?/zstd"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
